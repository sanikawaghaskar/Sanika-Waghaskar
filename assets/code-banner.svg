
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Sanika Waghaskar — AI and Software Engineering</title>
  <desc id="desc">A dark navy code-inspired banner with blue and purple accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#171B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748B" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <circle cx="1080" cy="45" r="150" fill="#6366F1" opacity=".08"/>
  <circle cx="1120" cy="270" r="130" fill="#8B5CF6" opacity=".09"/>

  <g font-family="monospace" font-size="14" fill="#94A3B8" opacity=".55">
    <text x="760" y="105">01  import intelligence</text>
    <text x="760" y="137">02  build(ideas)</text>
    <text x="760" y="169">03  automate(workflows)</text>
    <text x="760" y="201">04  improve(continuously)</text>
  </g>

  <rect x="72" y="64" width="5" height="150" rx="2.5" fill="url(#accent)"/>

  <g font-family="monospace">
    <text x="100" y="95" font-size="15" fill="#A5B4FC">&lt; developer /&gt;</text>
    <text x="100" y="153" font-size="42" font-weight="700" fill="#F8FAFC">SANIKA WAGHASKAR</text>
    <text x="100" y="190" font-size="21" fill="#C4B5FD">AI / GenAI Engineer · Software Developer</text>
    <text x="100" y="235" font-size="15" fill="#94A3B8">Building intelligent applications, one project at a time.</text>
  </g>

  <rect x="100" y="258" width="240" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
